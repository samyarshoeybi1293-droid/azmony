services:
  - type: web
    name: azmooni
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: azmooni-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AZMOONI_DB
        value: /var/data/azmooni.sqlite3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: '1'
